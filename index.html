<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#14161b" />
    <meta name="description" content="My favourite Romanian radio stations." />
    <link rel="icon" href="/icon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <title>My Radio</title>
  </head>
  <body>
    <header class="top">
      <h1>My Radio</h1>
      <button id="check" class="text-button" type="button" title="Try to connect to every stream and mark the ones that don't work">
        Check streams
      </button>
    </header>

    <main>
      <ul id="stations" class="grid" aria-label="Stations"></ul>
    </main>

    <footer id="player" class="player" aria-label="Player">
      <div class="now">
        <div id="now-logo" class="logo small" aria-hidden="true"></div>
        <div class="now-text">
          <div id="now-name" class="now-name">Pick a station</div>
          <div id="now-status" class="now-status" role="status" aria-live="polite"></div>
        </div>
      </div>
      <div class="controls">
        <button id="prev" class="icon-button" type="button" aria-label="Previous station">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6h2v12H6zM9.5 12 18 6v12z" /></svg>
        </button>
        <button id="toggle" class="icon-button primary" type="button" aria-label="Play">
          <svg id="icon-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5v14l11-7z" /></svg>
          <svg id="icon-stop" viewBox="0 0 24 24" aria-hidden="true" hidden><path d="M7 7h10v10H7z" /></svg>
        </button>
        <button id="next" class="icon-button" type="button" aria-label="Next station">
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M16 6h2v12h-2zM6 18V6l8.5 6z" /></svg>
        </button>
        <input id="volume" class="volume" type="range" min="0" max="1" step="0.05" aria-label="Volume" />
      </div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
